[project]
name = "kover-bot"
version = "0.1.0"
description = "A small Telegram bot for svalko.org"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Marat", email = "esquonk@gmail.com" },
]
dependencies = [
    "aiohttp>=3,<4",
    "beautifulsoup4>=4,<5",
    "python-dotenv>=1,<2",
    "python-telegram-bot>=22,<23",
    "reactivex>=4,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
